name: Staging validation

# Runs the whole central hosting platform on a throwaway Ubuntu runner and
# checks that it works: Docker installed from scratch, the stack up, two
# isolated applications, Realtime end to end, object storage, a backup and
# restore rehearsal, and scheduled jobs firing in another database.
#
# WHY A RUNNER AND NOT A VPS
#   No server has been bought, and Docker is deliberately not installed on the
#   owner's Mac. A GitHub-hosted runner is a disposable Ubuntu machine with
#   root, free on a public repository, and it is thrown away afterwards.
#
# NO PRODUCTION CREDENTIAL IS USED OR NEEDED. Every password, JWT secret and
# API key in this job is generated on the runner and dies with it. Nothing
# here can reach the live Supabase project or the shop's data.

on:
  workflow_dispatch:
  push:
    branches: [staging-validation]
    paths:
      - 'deploy/**'
      - '.github/workflows/staging-validation.yml'

permissions:
  contents: write        # only to commit the report back to this branch

jobs:
  # Fast feedback on the prerequisites: Docker install, the shared stack,
  # central roles, provisioning and isolation. Every failure so far has been in
  # that range, and this finishes in minutes while the full job takes twenty-
  # five. It runs in PARALLEL with the full job and never replaces it; its
  # report says so in its own header.
  prereq:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Run sections 1-5 only
        id: fast
        continue-on-error: true
        run: |
          chmod +x deploy/scripts/*.sh deploy/*.sh
          sudo -E STAGING_REPORT=/tmp/prereq-report.md \
            deploy/scripts/staging-test.sh --until 5 2>&1 | tee /tmp/prereq-console.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Logs from anything unhealthy
        if: always()
        continue-on-error: true
        run: |
          sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          for c in $(sudo docker ps -a --format '{{.Names}}'); do
            s=$(sudo docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null)
            [ "$s" = "running" ] || { echo "===== $c ($s) ====="; sudo docker logs "$c" --tail=40 2>&1 || true; }
          done
          echo "===== central-roles.log ====="
          sudo cat /srv/central/logs/central-roles.log 2>/dev/null || echo "(absent)"
      - name: Publish the fast report
        if: always()
        run: |
          mkdir -p deploy/staging-results
          sudo cp /tmp/prereq-report.md  deploy/staging-results/prereq-report.md 2>/dev/null || true
          sudo cp /tmp/prereq-console.log deploy/staging-results/prereq-console.log 2>/dev/null || true
          sudo cp /srv/central/logs/central-roles.log deploy/staging-results/central-roles.log 2>/dev/null || true
          sudo chown "$(id -u):$(id -g)" deploy/staging-results/* 2>/dev/null || true
          for f in deploy/staging-results/*; do
            [ -f "$f" ] && tail -c 200000 "$f" > /tmp/t && mv /tmp/t "$f"
          done
          { echo "Run: ${{ github.run_id }}"; echo "Scope: prerequisites only (sections 1-5)";
            echo "Commit: ${{ github.sha }}"; echo "Finished: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"; } \
            > deploy/staging-results/run-info.txt
          cat deploy/staging-results/prereq-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash -u -- deploy/staging-results >/dev/null 2>&1 || true
          git checkout --orphan staging-results-fast
          git rm -rq --cached . 2>/dev/null || true
          git stash pop >/dev/null 2>&1 || true
          git add -A -f deploy/staging-results
          git commit -q -m "Prerequisite results from run ${{ github.run_id }}"
          git push --force origin HEAD:staging-results-fast
      - name: Fail if a prerequisite failed
        if: always()
        run: |
          grep -q '\*\*FAIL\*\*' /tmp/prereq-report.md 2>/dev/null && {
            grep '\*\*FAIL\*\*' /tmp/prereq-report.md; exit 1; }
          echo "prerequisites passed"

  staging:
    # Pinned rather than ubuntu-latest: the Ubuntu release decides which
    # Docker apt repository codename is used, and a silent bump of that is
    # exactly what this job exists to catch.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Node, for the Realtime subscription test
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'

      - name: Facts about this runner
        run: |
          . /etc/os-release
          echo "$PRETTY_NAME ($VERSION_CODENAME)"
          echo "processors: $(nproc)"
          echo "memory:     $(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1024 )) MB"
          echo "disk free:  $(df -h / | awk 'NR==2{print $4}')"
          echo "docker:     $(docker --version 2>/dev/null || echo 'not installed')"

      - name: Run the staging validation
        id: staging
        continue-on-error: true      # the report is wanted even when a check fails
        run: |
          chmod +x deploy/scripts/*.sh deploy/*.sh
          sudo -E STAGING_REPORT=/tmp/staging-report.md \
            deploy/scripts/staging-test.sh 2>&1 | tee /tmp/staging-console.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Container state at the end
        if: always()
        continue-on-error: true
        run: |
          sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo
          sudo docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}' || true

      - name: Logs from anything unhealthy
        if: always()
        continue-on-error: true
        run: |
          for c in $(sudo docker ps -a --format '{{.Names}}'); do
            h=$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c" 2>/dev/null)
            s=$(sudo docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null)
            if [ "$s" != "running" ] || { [ "$h" != "healthy" ] && [ "$h" != "none" ]; }; then
              echo "===== $c ($s/$h) ====="
              sudo docker logs "$c" --tail=40 2>&1 || true
            fi
          done

      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f /tmp/staging-report.md ]; then
            cat /tmp/staging-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Staging validation did not produce a report' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 /tmp/staging-console.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verdict, computed from the report
        if: always()
        continue-on-error: true
        # readiness-package.py with no inventory and no sizing: the acceptance
        # table and the verdict, which is all that can be computed here.
        #
        # The project inventory and the VPS sizing are NOT produced in CI, on
        # purpose. The inventory names the owner's other projects and their
        # sizes, and this repository is public, so it stays off it entirely --
        # the complete package is generated on the owner's own machine from
        # this report plus the local inventory.
        run: |
          sudo chmod 0644 /tmp/staging-report.md 2>/dev/null || true
          python3 deploy/scripts/readiness-package.py \
            --full /tmp/staging-report.md \
            --repo . \
            --run-id "${{ github.run_id }}" \
            --out /tmp/VERDICT.md || true
          echo "## Verdict, computed from the evidence" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/## Verdict/,/## Acceptance/p' /tmp/VERDICT.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Publish the report to the results branch
        if: always()
        # Published to a DEDICATED branch, force-pushed.
        #
        # It used to commit onto the branch that triggered the run, which
        # silently stopped working the moment that branch moved on: the push
        # was rejected as non-fast-forward, the step printed "push skipped",
        # and the run's real output was lost. A second run's results were read
        # as if they were the first's. A separate branch cannot conflict.
        run: |
          mkdir -p deploy/staging-results
          sudo cp /tmp/staging-report.md  deploy/staging-results/report.md 2>/dev/null || true
          sudo cp /tmp/staging-console.log deploy/staging-results/console.log 2>/dev/null || true
          cp /tmp/VERDICT.md deploy/staging-results/VERDICT.md 2>/dev/null || true
          sudo chown "$(id -u):$(id -g)" deploy/staging-results/* 2>/dev/null || true
          # Trim the console log: the point is the verdicts, not every apt line.
          if [ -f deploy/staging-results/console.log ]; then
            tail -c 200000 deploy/staging-results/console.log > /tmp/t && mv /tmp/t deploy/staging-results/console.log
          fi
          {
            echo "Run: ${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo "Runner: ubuntu-24.04"
            echo "Finished: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > deploy/staging-results/run-info.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # An orphan branch holding only the results: no source, no history to
          # conflict with, and nothing from the working tree can be swept in.
          git stash -u -- deploy/staging-results >/dev/null 2>&1 || true
          git checkout --orphan staging-results
          git rm -rq --cached . 2>/dev/null || true
          git stash pop >/dev/null 2>&1 || true
          git add -A -f deploy/staging-results
          git commit -q -m "Staging validation results from run ${{ github.run_id }}"
          git push --force origin HEAD:staging-results
          echo "results published to the staging-results branch"

      - name: Fail the job if any check failed
        if: always()
        run: |
          grep -q '\*\*FAIL\*\*' /tmp/staging-report.md 2>/dev/null && {
            echo "At least one check failed. See the summary."
            grep '\*\*FAIL\*\*' /tmp/staging-report.md
            exit 1
          }
          echo "No failures recorded."
